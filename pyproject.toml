[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenniscareer"
version = "0.1.0"
description = "Retrieve Tennis Abstract career matches and plot age differences."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Repository = "https://github.com/UCB-stat159-f26/hw03-tylernw6"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
